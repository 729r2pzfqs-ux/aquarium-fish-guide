  <title>Page Not Found | FishFinder Guide</title>

  <script>
  (function(){
    var p = window.location.pathname;
    var s = window.location.search;

    // Prevent redirect loops
    var lk='ff404_'+p;
    try{if(sessionStorage.getItem(lk)){sessionStorage.removeItem(lk);return;}sessionStorage.setItem(lk,'1');}catch(e){}

    // 1. Template variable leaks
    if (p.indexOf('${') !== -1 || p.indexOf('{') !== -1) {
      window.location.replace('/');
      return;
    }

    // 2. Locale redirects: /es/X → /X, /fr/X → /X (English equivalent)
    var localeMatch = p.match(/^\/(es|fr|ar|ru|ja|zh|hi|pt|tr)\//);
    if (localeMatch) {
      var rest = p.replace(/^\/(es|fr|ar|ru|ja|zh|hi|pt|tr)\//, '/');
      if (rest === '/suche/' || rest === '/suche') rest = '/search/';
      if (rest === '/peces/' || rest === '/peces') rest = '/fish/';
      if (!rest || rest === '/') rest = '/';
      window.location.replace(rest + s);
      return;
    }

    // 3. German locale: /de/fische/X → try lowercase, fallback to /de/
    if (p.indexOf('/de/') === 0) {
      var lower = p.toLowerCase();
      if (p !== lower) {
        window.location.replace(lower + s);
        return;
      }
      window.location.replace('/de/');
      return;
    }

    // 4. Case normalization
    var lower = p.toLowerCase();
    if (p !== lower) {
      window.location.replace(lower + s);
      return;
    }

    // 5. Compare pages with query params
    if (p.indexOf('/compare') === 0) {
      window.location.replace('/compare/');
      return;
    }

    // 6. Section-based fallbacks for paths that still 404
    if (p.indexOf('/fish/') === 0) {
      window.location.replace('/fish/');
      return;
    }
    if (p.indexOf('/articles/') === 0) {
      window.location.replace('/');
      return;
    }

    // 7. Add trailing slash
    if (p.length > 1 && !p.match(/\.\w+$/) && !p.match(/\/$/)) {
      window.location.replace(p + '/' + s);
      return;
    }
  })();
  </script>
